<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Clientes</title>
    </head>
    <body>
        <main>
            <h1>Clientes atendidos</h1>

            <section th:each="cliente : ${clientes}">
                <h2 th:text="${cliente.nome}">
                    Nome do cliente
                </h2>

                <p>
                    E-mail:
                    <span th:text="${cliente.email}">
                        email@exemplo.com
                    </span>
                </p>

                <h3>Clusters</h3>

                <ul>
                    <li th:each="cluster : ${cliente.clusters}">
                        <strong th:text="${cluster.nome}">
                            Nome do cluster
                        </strong>

                        <span>
                            —
                            <span th:text="${cluster.hostname}">
                                hostname
                            </span>
                        </span>
                    </li>
                </ul>

                <p th:if="${#lists.isEmpty(cliente.clusters)}">
                    Este cliente não possui clusters cadastrados.
                </p>

                <hr>
            </section>
        </main>
    </body>
</html>
